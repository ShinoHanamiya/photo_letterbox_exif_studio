<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Letterbox EXIF Studio v1.1.3</title>
  <meta name="description" content="写真をクロップせず16:9などに整え、余白へ撮影情報を表示する無料のブラウザツール。写真はアップロードされません。" />
  <meta name="theme-color" content="#f5f6f8" />
  <script defer src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="app">
    <div class="panel controls">
      <h1>Photo Letterbox EXIF Studio v1.1.3</h1>
      <p class="lead">画像サイズを指定し、上下余白を追加して、下余白にEXIF情報をスタイリッシュに表示するローカル実行ツールです。<strong>クロッピングはせず</strong>、元画像を必ず全体表示します。</p>

      <div class="group">
        <h2>1. 画像読み込み</h2>
        <div class="field">
          <label for="fileInput">画像ファイル</label>
          <input id="fileInput" type="file" accept="image/*" />
        </div>
        <div id="imageMeta" class="hint">まだ画像が読み込まれていません。</div>
      </div>

      <div class="group">
        <h2>2. 出力サイズ</h2>
        <div class="field">
          <label for="aspectPreset">アスペクト比プリセット</label>
          <select id="aspectPreset">
            <option value="16:9">16:9</option>
            <option value="3:2">3:2</option>
            <option value="4:3">4:3</option>
            <option value="1:1">1:1</option>
            <option value="9:16">9:16</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="outWidth">出力幅(px)</label>
            <input id="outWidth" type="number" min="100" step="10" value="1920" />
          </div>
          <div class="field">
            <label for="outHeight">出力高さ(px)</label>
            <input id="outHeight" type="number" min="100" step="10" value="1080" />
          </div>
        </div>
        <div class="hint">プリセット選択時は高さが自動更新されます。カスタム選択時は幅・高さを個別指定できます。</div>
      </div>

      <div class="group">
        <h2>3. 余白・背景</h2>
        <div class="row">
          <div class="field">
            <label for="topMargin">上余白(%)</label>
            <input id="topMargin" type="number" min="0" max="40" step="0.5" value="10" />
          </div>
          <div class="field">
            <label for="bottomMargin">下余白(%)</label>
            <input id="bottomMargin" type="number" min="5" max="50" step="0.5" value="10" />
          </div>
        </div>
        <div class="field">
          <label>余白色</label>
          <div class="chips" id="bgColorChips">
            <div class="chip" data-bg="white">白</div>
            <div class="chip active" data-bg="black">黒</div>
          </div>
        </div>
      </div>

      <div class="group">
        <h2>4. EXIF表示</h2>
        <div class="checkboxes">
          <label class="check"><input type="checkbox" id="showCamera" checked /> 機材名</label>
          <label class="check"><input type="checkbox" id="showLens" checked /> レンズ名</label>
          <label class="check"><input type="checkbox" id="showFocal" checked /> 焦点距離</label>
          <label class="check"><input type="checkbox" id="showFNumber" checked /> F値</label>
          <label class="check"><input type="checkbox" id="showShutter" checked /> シャッター速度</label>
          <label class="check"><input type="checkbox" id="showISO" checked /> ISO</label>
          <label class="check"><input type="checkbox" id="showDate" checked /> 撮影日</label>
          <label class="check"><input type="checkbox" id="showTitleLine" /> 区切り線</label>
        </div>
        <div class="row">
          <div class="field">
            <label for="textAlign">文字寄せ</label>
            <select id="textAlign">
              <option value="left">左寄せ</option>
              <option value="center" selected>中央寄せ</option>
              <option value="right">右寄せ</option>
            </select>
          </div>
          <div class="field">
            <label for="textVerticalAlign">余白内の縦配置</label>
            <select id="textVerticalAlign">
              <option value="top">上寄せ</option>
              <option value="middle" selected>中央</option>
              <option value="bottom">下寄せ</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="fontScale">文字サイズ(基準)</label>
            <input id="fontScale" type="number" min="0.5" max="2.5" step="0.1" value="1.0" />
          </div>
          <div class="field">
            <label for="textBlockOffset">縦位置微調整(px)</label>
            <input id="textBlockOffset" type="number" step="1" value="0" />
          </div>
        </div>
        <div class="field">
          <label for="customText1">自由記述1（1行目末尾）</label>
          <input id="customText1" type="text" placeholder="例: 公園" />
        </div>
        <div class="field">
          <label for="customText2">自由記述2（2行目末尾）</label>
          <input id="customText2" type="text" placeholder="例: 秋" />
        </div>
        <div class="field">
          <label for="customText3">自由記述3（3行目）</label>
          <input id="customText3" type="text" placeholder="例: メモ / 場所 / タイトル" />
        </div>
      </div>

      <div class="group">
        <h2>5. 出力</h2>
        <div class="row">
          <div class="field">
            <label for="exportFormat">保存形式</label>
            <select id="exportFormat">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>
          <div class="field">
            <label for="jpegQuality">JPEG品質(%)</label>
            <input id="jpegQuality" type="number" min="50" max="100" step="1" value="95" />
          </div>
        </div>
        <div class="buttons">
          <button id="renderBtn" type="button">プレビュー更新</button>
          <button id="saveBtn" type="button">画像を保存</button>
          <button id="resetBtn" type="button" class="secondary">設定を初期化</button>
        </div>
      </div>
    </div>

    <div class="panel preview">
      <div class="preview-head">
        <div>
          <strong>プレビュー</strong>
          <div id="previewInfo" class="preview-info">画像を読み込むとここに情報が表示されます。</div>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="previewCanvas" width="1920" height="1080"></canvas>
      </div>
    </div>
  </div>

  <script defer src="./assets/app.js"></script>
</body>
</html>
